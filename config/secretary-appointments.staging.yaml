# Staging-only manifest for the WhatsApp Feegow appointment workflow.
# This file is not loaded by the running secretary profile and must not be
# copied to the live profile without the separate rollout approval.
platforms:
  whatsapp:
    secretary_appointments:
      enabled: true
      write_enabled: false
      professional_id: 1
      specialty_id: 1
      local_id: 1
      channel_id: 3
      cancel_reason_id: 1
      slot_search_days: 15
      authorization_ttl_minutes: 15
      return_procedure_id: 2
      return_window_days: 60
      payment:
        enabled: false
        beneficiary: ""
        instructions: ""
        ingestion_grace_seconds: 60
      rollout:
        environment: staging
        activate_on_startup: false
        allow_real_mutations: false
